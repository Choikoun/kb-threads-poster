name: 뉴스 자동포스팅 - 저녁 스크롤 (보험·노후·상속)

on:
  schedule:
    - cron: '38 12 * * *'   # 매일 21:00 KST 무렵
  workflow_dispatch:
    inputs:
      category:
        description: '카테고리'
        default: 'insurance'

concurrency:
  group: news-trend-pm
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  post_news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 패키지 설치
        run: pip install requests feedparser google-genai beautifulsoup4 python-dotenv
      - name: 저녁 스크롤 가족·자산 포스팅
        # 믹스 리밸런싱 실험(2026-08-07): 범용 트렌드 68% 편중 → 정체성 콘텐츠(상속·가족) 확대.
        # 21시대는 자기 전 스크롤 시간 — 역대 메가히트(이혼 34,254·요양원 30,734)가 전부 이 앵글.
        # 2주 후 주간분석 팔로워 델타로 판정, 효과 없으면 trend로 원복.
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          for i in 1 2 3; do
            python news_auto_poster.py insurance && exit 0
            if [ $i -lt 3 ]; then echo "시도 $i 실패, 30초 후 재시도..."; sleep 30; fi
          done
          exit 1
      - name: 콘텐츠 로그 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.jsonlog.driver "python merge_json_log.py %O %A %B"
          git add content_log.json
          git diff --staged --quiet || git commit -m "콘텐츠 로그 업데이트"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            git rebase --abort 2>/dev/null || true
            echo "push 충돌 — 재시도 $attempt/5"; sleep $((attempt * 5))
          done
      - name: 실패 알림
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "⚠️ 포스팅 실패: ${{ github.workflow }} ($(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M'))" \
            --body "[로그](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
