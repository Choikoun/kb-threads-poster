name: 인스타 카드뉴스 게시 - 연금 계산기·가수금뜻 (수동, mode 선택)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'calc(연금 수령액 계산기) 또는 gasu(가수금뜻 블로그 요약)'
        required: true
        default: 'calc'

permissions:
  contents: write

jobs:
  post_promo_1022:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 패키지 설치
        run: pip install requests python-dotenv Pillow google-genai feedparser beautifulsoup4
      - name: 인스타 게시
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: python promo_1022_ig_post.py ${{ github.event.inputs.mode }}
      - name: 로그 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.jsonlog.driver "python merge_json_log.py %O %A %B"
          git add instagram_log.json
          git diff --staged --quiet || git commit -m "상속세 계산기 홍보 IG 로그 추가"
          pushed=false
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              pushed=true
              break
            fi
            git rebase --abort 2>/dev/null || true
            echo "push 충돌 — 재시도 $attempt/5"; sleep $((attempt * 5))
          done
          if [ "$pushed" = false ]; then
            echo "::error::로그 커밋 push 5회 재시도 모두 실패"
            exit 1
          fi
