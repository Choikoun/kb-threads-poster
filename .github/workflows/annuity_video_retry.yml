name: 연금보험 릴스 영상 재발행 시도 (진단용, 1회성)

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/annuity_video_retry.yml']

permissions:
  contents: write
  issues: write

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 패키지 설치
        run: pip install requests feedparser google-genai beautifulsoup4 python-dotenv Pillow edge-tts
      - name: 재발행 시도
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
        run: python annuity_video_retry.py
      - name: 로그 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.jsonlog.driver "python merge_json_log.py %O %A %B"
          git add content_log.json instagram_log.json
          git diff --staged --quiet || git commit -m "연금보험 릴스 영상 재발행 로그"
          pushed=false
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              pushed=true
              break
            fi
            git rebase --abort 2>/dev/null || true
            echo "push 충돌 — 재시도 $attempt/5"; sleep $((attempt * 5))
          done
          if [ "$pushed" = false ]; then
            echo "::error::로그 커밋 push 5회 재시도 모두 실패"
            exit 1
          fi
