name: KB 애니메이션 릴스 렌더 테스트 (게시 없음, 수동)

on:
  workflow_dispatch:
    inputs:
      module:
        description: '렌더할 모듈(기본 irp_anim_reels_post, __main__ 이 영상만 만들고 게시하지 않음)'
        required: false
        default: 'irp_anim_reels_post'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: ffmpeg 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: 패키지 설치
        run: pip install requests feedparser google-genai beautifulsoup4 python-dotenv Pillow edge-tts
      - name: 렌더(게시 안 함)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          KB_OUT: kb_anim_test.mp4
        run: python ${{ github.event.inputs.module }}.py
      - name: 길이 확인과 대표 프레임 추출
        run: |
          ffprobe -v error -show_entries format=duration:stream=width,height,r_frame_rate -of default=nw=1 kb_anim_test.mp4
          mkdir -p frames
          for t in 0.1 1.5 6 12 18 24; do ffmpeg -y -loglevel error -ss $t -i kb_anim_test.mp4 -frames:v 1 frames/f_$t.png || true; done
      - uses: actions/upload-artifact@v4
        with:
          name: kb-anim-test
          path: |
            kb_anim_test.mp4
            frames/
