name: 인스타 건강검진 카드뉴스 게시 (1회성 수동)

on:
  push:
    paths:
      - '.github/workflows/health_checkup_ig_post.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post_health_checkup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 패키지 설치
        run: pip install requests python-dotenv Pillow
      - name: 인스타 게시
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: python health_checkup_ig_post.py
